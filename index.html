<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>কি পরবো – Ki Porbo</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="md:flex min-h-screen">
  <!-- Sidebar (desktop) -->
  <aside class="hidden md:flex flex-col w-64 shrink-0 p-6 bg-white border-r border-line sticky top-0 h-screen">
    <h1 class="logo text-3xl mb-10">কি পরবো</h1>
    <nav id="sideNav" class="flex flex-col gap-2"></nav>
    <p class="mt-auto text-xs text-stone-500 leading-relaxed">Your clothes are saved in this browser only. They don't sync to other devices.</p>
  </aside>

  <div class="flex-1 min-w-0 pb-24 md:pb-0">
    <header class="topbar flex items-center justify-between gap-3 px-5 md:px-10 py-5">
      <div>
        <h2 id="pageTitle" class="font-serif text-2xl md:text-3xl">Main Menu</h2>
        <p id="pageSub" class="text-sm text-stone-600"></p>
      </div>
      <button id="addBtn" class="btn">+ Add clothing</button>
    </header>

    <main class="px-5 md:px-10 pb-10">
      <section id="view-home"></section>

      <section id="view-closet" hidden>
        <div id="stats" class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6"></div>
        <input id="search" type="search" placeholder="Search by name, color or notes…" class="field mb-4">
        <div id="chips" class="flex gap-2 flex-wrap mb-6"></div>
        <div id="gallery" class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-4 gap-4"></div>
      </section>

      <section id="view-builder" hidden>
        <div class="grid lg:grid-cols-5 gap-6">
          <div class="lg:col-span-2 card p-5 h-fit">
            <div id="preview" class="grid grid-cols-3 gap-3 mb-5"></div>
            <input id="outfitName" class="field mb-3" placeholder="Outfit name (e.g. University Day)">
            <div class="flex gap-2">
              <button id="saveOutfit" class="btn flex-1">Save outfit</button>
              <button id="clearOutfit" class="btn btn-soft">Clear</button>
            </div>
          </div>
          <div id="pickers" class="lg:col-span-3 space-y-6"></div>
        </div>
      </section>

      <section id="view-saved" hidden>
        <div id="savedGrid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-5"></div>
      </section>
    </main>
  </div>
</div>

<!-- Bottom nav (mobile) -->
<nav id="bottomNav" class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-line flex justify-around py-2 z-30"></nav>

<!-- Add clothing modal -->
<div id="modal" class="modal" hidden>
  <form id="addForm" class="card modal-box p-6 space-y-4" novalidate>
    <h3 class="font-serif text-2xl">Add clothing</h3>
    <label class="drop" for="photo">
      <img id="photoPreview" class="hidden w-full h-full object-cover rounded-xl" alt="Preview">
      <span id="dropText">Tap to choose a photo</span>
    </label>
    <input id="photo" type="file" accept="image/*" class="hidden">
    <input id="name" class="field" placeholder="Item name *">
    <select id="category" class="field"></select>
    <input id="color" class="field" placeholder="Color (e.g. Sage green)">
    <textarea id="notes" rows="2" class="field" placeholder="Notes (optional)"></textarea>
    <p id="formErr" class="text-sm text-red-700 min-h-[1.25rem]"></p>
    <div class="flex gap-2 justify-end">
      <button type="button" id="cancelAdd" class="btn btn-soft">Cancel</button>
      <button type="submit" class="btn">Save item</button>
    </div>
  </form>
</div>

<div id="toast" class="toast" hidden></div>
<script src="script.js"></script>
</body>
</html>
